<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App | Task Manager</title>
    <link rel="stylesheet" href="todo-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<div class="container">
    <!-- Header -->
    <header class="header">
        <h1><i class="fas fa-tasks"></i> My To-Do List</h1>
        <p class="subtitle">Stay organized and productive</p>
    </header>

    <!-- Input Section -->
    <div class="input-section">
        <div class="input-wrapper">
            <input 
                type="text" 
                id="taskInput" 
                class="task-input" 
                placeholder="Add a new task..."
                autocomplete="off"
            >
            <button id="addBtn" class="add-btn">
                <i class="fas fa-plus"></i> Add Task
            </button>
        </div>
        <div class="input-options">
            <select id="categorySelect" class="category-select">
                <option value="all">All Categories</option>
                <option value="work">Work</option>
                <option value="personal">Personal</option>
                <option value="shopping">Shopping</option>
                <option value="health">Health</option>
                <option value="other">Other</option>
            </select>
        </div>
    </div>

    <!-- Stats Section -->
    <div class="stats-section">
        <div class="stat-card">
            <i class="fas fa-list-check"></i>
            <div class="stat-info">
                <span class="stat-label">Total Tasks</span>
                <span class="stat-value" id="totalTasks">0</span>
            </div>
        </div>
        <div class="stat-card">
            <i class="fas fa-check-circle"></i>
            <div class="stat-info">
                <span class="stat-label">Completed</span>
                <span class="stat-value" id="completedTasks">0</span>
            </div>
        </div>
        <div class="stat-card">
            <i class="fas fa-hourglass"></i>
            <div class="stat-info">
                <span class="stat-label">Pending</span>
                <span class="stat-value" id="pendingTasks">0</span>
            </div>
        </div>
    </div>

    <!-- Filter Section -->
    <div class="filter-section">
        <button class="filter-btn active" data-filter="all">
            <i class="fas fa-layer-group"></i> All
        </button>
        <button class="filter-btn" data-filter="active">
            <i class="fas fa-circle"></i> Active
        </button>
        <button class="filter-btn" data-filter="completed">
            <i class="fas fa-check-circle"></i> Completed
        </button>
        <button class="filter-btn" data-filter="clear-completed">
            <i class="fas fa-trash"></i> Clear Completed
        </button>
    </div>

    <!-- Tasks List -->
    <div class="tasks-section">
        <ul class="tasks-list" id="tasksList">
            <!-- Tasks will be added here dynamically -->
        </ul>
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState">
        <i class="fas fa-inbox"></i>
        <h2>No tasks yet</h2>
        <p>Add your first task to get started!</p>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>Made with <i class="fas fa-heart"></i> by Khushi Awasthi</p>
        <p>Your tasks are saved locally on your device</p>
    </footer>
</div>

<script src="todo-script.js"></script>

</body>
</html>
